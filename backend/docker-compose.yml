services:
  db:
    image: postgres:17
    container_name: finance-engine-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: finance_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: finance_engine

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - finance_engine_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U finance_user -d finance_engine"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  finance_engine_postgres_data: