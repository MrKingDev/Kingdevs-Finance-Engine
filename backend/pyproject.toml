[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "David", email = "88470336+MrKingDev@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "babel>=2.17,<3",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.32",
    "reportlab>=4.4,<5",
    "sqlalchemy>=2.1.1",
    "tzdata>=2026.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pypdf>=6,<7",
]
