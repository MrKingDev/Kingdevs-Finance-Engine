# Explicitly opt in: docker compose -f compose.demo.yaml up --build -d --wait
# This project never includes the normal Compose file, .env or database volume.
name: finance-engine-demo

x-backend: &backend_image
  image: finance-engine-demo-backend
  build: ./backend

x-database: &demo_database
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  POSTGRES_USER: finance_demo
  POSTGRES_PASSWORD: finance_demo_local
  POSTGRES_DB: finance_engine_demo
  DEMO_MODE: "true"

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: finance_demo
      POSTGRES_PASSWORD: finance_demo_local
      POSTGRES_DB: finance_engine_demo
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_demo -d finance_engine_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend_image
    environment: *demo_database
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *backend_image
    environment: *demo_database
    command: ["python", "-m", "backend.seed_demo"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    <<: *backend_image
    environment: *demo_database
    ports:
      - "127.0.0.1:${DEMO_BACKEND_PORT:-8002}:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  frontend:
    image: finance-engine-demo-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_DEMO_MODE: "true"
    ports:
      - "127.0.0.1:${DEMO_FRONTEND_PORT:-3002}:3001"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  demo_postgres_data:
